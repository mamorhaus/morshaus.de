name: Deploy Morshaus Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: SSH-Schlüssel vorbereiten
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/morshaus
          chmod 600 ~/.ssh/morshaus
          ssh-keyscan -p 22 "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Theme per SFTP deployen
        shell: bash
        run: |
          find . -type d \
            ! -path './.git*' \
            ! -path './.github*' \
            ! -path '.' \
            -printf 'mkdir public_html/wp-content/themes/morshaus-pilot/%P\n' \
            > /tmp/mkdirs.txt

          {
            echo "cd public_html/wp-content/themes/morshaus-pilot"
            cat /tmp/mkdirs.txt
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/*' \
              -printf 'put "%p" "%p"\n' |
              sed 's#"\./#"#g'
          } > /tmp/sftp-batch.txt

          sftp \
            -i ~/.ssh/morshaus \
            -P 22 \
            -b /tmp/sftp-batch.txt \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}"
