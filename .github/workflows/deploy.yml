name: Deploy Morshaus Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Morshaus Theme per SFTP zu Hetzner deployen
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          ssh_private_key: ${{ secrets.HETZNER_SSH_KEY }}
          port: 22
          local_path: './*'
          remote_path: 'public_html/wp-content/themes/morshaus-pilot'
          sftp_only: true
